name: Apply complex domain cleanup
on:
  push:
    branches:
      - prototype/atomic-complex-domain-fixes
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fold domain rules into methods.jl
        run: |
          python - <<'PY'
          from pathlib import Path

          methods = Path('src/methods.jl')
          s = methods.read_text()
          old = '''for f in [real, imag]
              @eval function promote_symtype(::$(typeof(f)), T::TypeT)
                  if T <: Complex
                      return T.parameters[1]::TypeT
                  else
                      return T
                  end
              end
          end
          '''
          new = '''for f in [real, imag]
              @eval function promote_symtype(::$(typeof(f)), T::TypeT)
                  if T === Number
                      return Real
                  elseif T <: Complex
                      return T.parameters[1]::TypeT
                  else
                      return T
                  end
              end
          end
          for f in [abs, abs2]
              @eval promote_symtype(::$(typeof(f)), ::TypeT) = Real
          end
          '''
          if old in s:
              methods.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('expected real/imag promote_symtype block not found')

          mod = Path('src/SymbolicUtils.jl')
          t = mod.read_text()
          mod.write_text(t.replace('include("complex_domains.jl")\n', ''))

          helper = Path('src/complex_domains.jl')
          if helper.exists():
              helper.unlink()

          basics = Path('test/basics.jl')
          b = basics.read_text()
          old_expect = 'SymbolicUtils.promote_symtype(sin ∘ abs ∘ sqrt, Number) == Number'
          new_expect = 'SymbolicUtils.promote_symtype(sin ∘ abs ∘ sqrt, Number) == Real'
          if old_expect in b:
              basics.write_text(b.replace(old_expect, new_expect, 1))
          elif new_expect not in b:
              raise SystemExit('expected composed-function test not found')
          PY
          if git diff --quiet -- src/methods.jl src/SymbolicUtils.jl src/complex_domains.jl test/basics.jl; then
            echo 'Already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/methods.jl src/SymbolicUtils.jl src/complex_domains.jl test/basics.jl
          git commit -m 'test: align composed complex codomain semantics'
          git push
