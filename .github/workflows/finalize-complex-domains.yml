name: Finalize complex domain fixes
on:
  push:
    branches:
      - prototype/atomic-complex-domain-fixes
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply final source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          methods = Path('src/methods.jl')
          text = methods.read_text()
          old = 'if f in [sign, signbit, ceil, floor, factorial, exp]'
          new = 'if f in [sign, signbit, ceil, floor, factorial, exp, abs, abs2]'
          if old not in text:
              raise SystemExit('monadic skip list not found')
          text = text.replace(old, new, 1)

          anchor = '''for f in [real, imag, conj]\n    @eval function promote_shape(::typeof($f), sh::ShapeT)\n'''
          insertion = '''function promote_shape(::typeof(complex), sha::ShapeT, shb::ShapeT)\n    @nospecialize sha shb\n    if is_array_shape(sha) || is_array_shape(shb)\n        _throw_array(complex, sha, shb)\n    end\n    return ShapeVecT()\nend\n\nfor f in [real, imag, conj]\n    @eval function promote_shape(::typeof($f), sh::ShapeT)\n'''
          if anchor not in text:
              raise SystemExit('shape anchor not found')
          text = text.replace(anchor, insertion, 1)
          methods.write_text(text)

          poly = Path('src/polyform.jl')
          text = poly.read_text()
          old = '''        BSImpl.Term(; f, args, type, shape) => begin\n            if f === (^) && isconst(args[2]) && (exp = unwrap_const(args[2]); exp isa Real) && safe_isinteger(exp)\n'''
          new = '''        BSImpl.Term(; f, args, type, shape) => begin\n            if f === complex && length(args) == 2\n                # `complex(re, im)` is an explicit Cartesian scalar constructor. For\n                # polynomial canonicalization it is algebraically equivalent to\n                # `re + im * im_part`; lowering it here lets equivalent forms cancel\n                # without relaxing the constructor's real-component contract.\n                rpoly = to_poly!(poly_to_bs, bs_to_poly, args[1], recurse)\n                ipoly = to_poly!(poly_to_bs, bs_to_poly, args[2], recurse)\n                return rpoly + im * ipoly\n            elseif f === (^) && isconst(args[2]) && (exp = unwrap_const(args[2]); exp isa Real) && safe_isinteger(exp)\n'''
          if old not in text:
              raise SystemExit('polyform term anchor not found')
          text = text.replace(old, new, 1)
          poly.write_text(text)
          PY
          git rm .github/workflows/finalize-complex-domains.yml
      - name: Commit final source form
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/methods.jl src/polyform.jl
          git commit -m 'fix: preserve complex scalar domains and Cartesian normalization'
          git push origin HEAD:prototype/atomic-complex-domain-fixes
