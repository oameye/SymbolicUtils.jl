name: Patch complex domain test expectation
on:
  push:
    branches:
      - prototype/atomic-complex-domain-fixes
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update composed-function codomain expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/basics.jl')
          s = p.read_text()
          old = '@test SymbolicUtils.promote_symtype(sin ∘ abs ∘ sqrt, Number) == Number'
          new = '@test SymbolicUtils.promote_symtype(sin ∘ abs ∘ sqrt, Number) == Real'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/basics.jl
          git commit -m 'test: expect real codomain after abs'
          git push origin HEAD:prototype/atomic-complex-domain-fixes
