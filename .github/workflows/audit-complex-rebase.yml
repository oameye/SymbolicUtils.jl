name: Materialize complex rebase

on:
  push:
    branches:
      - audit/complex-rebase-4.46.5

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rebase complex commit onto SymbolicUtils 4.46.5
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "audit-bot"
          git config user.email "audit@example.invalid"
          git fetch origin review/complex-number-minimal
          git checkout --detach 072624b59b54713e69c2bfbbd34ca7e3fa0d8953
          git cherry-pick 518331aa9d17f57e126953c72b05c2045c1a5567
          git show --stat --oneline HEAD
          git push --force origin HEAD:refs/heads/audit/complex-rebased-result
