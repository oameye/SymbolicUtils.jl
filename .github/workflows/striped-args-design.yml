name: Striped args design

on:
  push:
    branches:
      - prototype/threadsafe-args-striped-lock

permissions:
  contents: read

concurrency:
  group: striped-args-design
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype tooling
        uses: actions/checkout@v4
        with:
          ref: prototype/threadsafe-args-striped-lock
          path: lock

      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          ref: b3c7b36c85ed2b1691bddc3c2d1ca36413ca984e
          path: master

      - name: Checkout atomic-wrapper PR head
        uses: actions/checkout@v4
        with:
          ref: cd183ac417986e9403a381500aab2553431a5a39
          path: wrapper

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Apply striped-lock prototype
        working-directory: lock
        run: python dev/striped_args_lock.py

      - name: Verify representation is unchanged
        working-directory: lock
        run: |
          git diff -- src/terminterface.jl
          test -z "$(git diff --name-only -- src/types.jl src/small_array.jl)"

      - name: Instantiate dependencies once
        run: julia --project=master -e 'using Pkg; Pkg.instantiate()'

      - name: Load all three variants
        run: |
          julia --project=master -e 'using SymbolicUtils'
          julia --project=wrapper -e 'using SymbolicUtils'
          julia --project=lock -e 'using SymbolicUtils'

      - name: Verify direct args surface
        working-directory: lock
        run: |
          julia --project=. -e '
            using SymbolicUtils
            using SymbolicUtils: SymReal, BSImpl, ArgsT
            using Moshi.Match: @match
            using TermInterface
            xs = [SymbolicUtils.Sym{SymReal}(Symbol(:x_, i); type=Real) for i in 1:8]
            ex = sum(xs)
            raw = @match ex begin
              BSImpl.AddMul(; args) => args
              _ => error("not AddMul")
            end
            @assert raw isa ArgsT{SymReal}
            @assert isempty(raw)
            arguments(ex)
            @assert !isempty(raw)
            @assert raw isa ArgsT{SymReal}
            println("direct args surface preserved: ", typeof(raw))
          '

      - name: Microbench and stress - atomic wrapper
        run: julia --project=wrapper --threads=8 lock/dev/bench_args_cache.jl

      - name: Microbench and stress - striped lock
        run: julia --project=lock --threads=8 lock/dev/bench_args_cache.jl

      - name: Baseline race check
        continue-on-error: true
        run: julia --project=master --threads=8 lock/dev/bench_args_cache.jl

      - name: Full prototype tests
        working-directory: lock
        env:
          JULIA_NUM_THREADS: '8'
        run: julia --project=. -e 'using Pkg; Pkg.test()'
