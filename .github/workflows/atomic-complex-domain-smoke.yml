name: Atomic complex domain smoke
on:
  push:
    branches:
      - prototype/atomic-complex-domain-fixes
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.13'
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Raw domain probe
        run: julia --project=. test/atomic_complex_domains.jl
      - name: Full SymbolicUtils tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
