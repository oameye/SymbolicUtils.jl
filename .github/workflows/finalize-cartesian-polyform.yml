name: Finalize Cartesian polyform
on:
  push:
    branches:
      - prototype/atomic-complex-domain-fixes
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve wide polynomial coefficient type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/polyform.jl')
          text = path.read_text()
          old = '''                rpoly = to_poly!(poly_to_bs, bs_to_poly, args[1], recurse)\n                ipoly = to_poly!(poly_to_bs, bs_to_poly, args[2], recurse)\n                return rpoly + im * ipoly\n'''
          new = '''                rpoly = to_poly!(poly_to_bs, bs_to_poly, args[1], recurse)\n                ipoly = to_poly!(poly_to_bs, bs_to_poly, args[2], recurse)\n                poly = zeropoly()\n                MA.operate!(+, poly, rpoly)\n                if ipoly isa PolyVarT\n                    ipoly = MA.operate(*, PolynomialT, ipoly, im)\n                else\n                    ipoly = MA.copy_if_mutable(ipoly)\n                    MA.operate!(*, ipoly, im)\n                end\n                MA.operate!(+, poly, ipoly)\n                return poly\n'''
          if old not in text:
              raise SystemExit('Cartesian polyform block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/finalize-cartesian-polyform.yml
      - name: Commit final source form
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/polyform.jl
          git commit -m 'fix: retain wide coefficients for Cartesian polyform'
          git push origin HEAD:prototype/atomic-complex-domain-fixes
